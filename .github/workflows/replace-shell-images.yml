# trigger
name: Replace shell images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-shell-images.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples webp imagemagick

      - name: Convert and replace shell images
        shell: bash
        run: |
          set -euo pipefail

          test -f assets/media/IMG_3740.HEIC
          test -f assets/media/IMG_3745.png
          test -f assets/media/IMG_3172.JPG

          rm -f /tmp/inner.png /tmp/edge.png
          heif-convert assets/media/IMG_3740.HEIC /tmp/inner.png
          convert assets/media/IMG_3172.JPG -auto-orient /tmp/edge.png

          cwebp -quiet -q 88 /tmp/inner.png -o assets/media/shell-inner.webp
          cwebp -quiet -q 88 assets/media/IMG_3745.png -o assets/media/shell-outer.webp
          cwebp -quiet -q 88 /tmp/edge.png -o assets/media/shell-edge.webp

          rm assets/media/IMG_3740.HEIC assets/media/IMG_3745.png assets/media/IMG_3172.JPG

      - name: Rebuild dist
        run: |
          npm ci
          npm run build

      - name: Commit replacements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/replace-shell-images.yml
          git add             assets/media/shell-inner.webp             assets/media/shell-outer.webp             assets/media/shell-edge.webp             dist/assets/media/shell-inner.webp             dist/assets/media/shell-outer.webp             dist/assets/media/shell-edge.webp
          git add -u --             assets/media/IMG_3740.HEIC             assets/media/IMG_3745.png             assets/media/IMG_3172.JPG

          git diff --cached --check
          git commit -m "Replace shell material photos"
          git push origin HEAD:main

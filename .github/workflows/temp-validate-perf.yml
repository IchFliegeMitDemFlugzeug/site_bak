name: Temporary performance branch validation

on:
  push:
    branches:
      - perf-mobile-lighthouse-20260930

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-mobile-lighthouse-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: |
          node --check assets/main.js
          node --check assets/btsCloudBackground.js
          node --check assets/site-architecture.js
      - name: Build and verify committed dist
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: List Playwright suite
        run: npm run test:stage -- --list

<!DOCTYPE html>
<html lang="ru">

<head>
  <!-- Указываем кодировку страницы. -->
  <meta charset="UTF-8">

  <!-- Делаем страницу корректной на телефонах и планшетах. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Заголовок вкладки браузера. -->
  <title>Страница не найдена — БТС</title>

  <!-- Запрещаем поисковикам индексировать страницу ошибки. -->
  <meta name="robots" content="noindex, follow">

  <!-- Подключаем существующий favicon сайта. -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <!-- Подключаем основную таблицу стилей существующего сайта. -->
  <link rel="stylesheet" href="/assets/styles.css?v=10.11">

  <!-- Подключаем дизайн-систему существующего сайта. -->
  <link rel="stylesheet" href="/assets/design-system.css?v=10.10">

  <style>
    /* Растягиваем страницу ошибки минимум на весь экран. */
    .error-page {
      min-height: 100vh;

      /* Центрируем содержимое по вертикали. */
      display: flex;

      /* Выравниваем содержимое по вертикальной оси. */
      align-items: center;

      /* Оставляем место под существующую фиксированную шапку. */
      padding: 150px 0 80px;

      /* Используем обычный светлый фон сайта. */
      background: var(--color-bg);
    }

    /* Ограничиваем ширину текста, чтобы композиция не растягивалась. */
    .error-page__content {
      max-width: 900px;
    }

    /* Большой технический номер ошибки. */
    .error-page__code {
      margin: 0 0 24px;

      /* Используем крупный размер из дизайн-системы. */
      font-size: clamp(84px, 14vw, 190px);

      /* Делаем цифры выразительными. */
      font-weight: 600;

      /* Уменьшаем межстрочный интервал. */
      line-height: .85;

      /* Используем металлический серый цвет сайта. */
      color: var(--color-metal);
    }

    /* Заголовок сообщения. */
    .error-page h1 {
      max-width: 850px;

      /* Убираем стандартный внешний отступ сверху. */
      margin: 0;

      /* Используем крупную адаптивную типографику. */
      font-size: clamp(42px, 5vw, 76px);

      /* Делаем строку плотной, как в остальных display-заголовках сайта. */
      line-height: 1;

      /* Немного уплотняем буквы. */
      letter-spacing: -.04em;
    }

    /* Поясняющий текст. */
    .error-page__text {
      max-width: 600px;

      /* Отделяем текст от заголовка. */
      margin: 32px 0 0;

      /* Используем вторичный цвет текста. */
      color: var(--color-copy-secondary);

      /* Сохраняем комфортный размер основного текста. */
      font-size: 18px;

      /* Увеличиваем межстрочный интервал для читаемости. */
      line-height: 1.6;
    }

    /* Отделяем кнопку от текста. */
    .error-page__actions {
      margin-top: 36px;
    }
  </style>
</head>

<body>

  <!-- Используем ту же точку монтирования шапки, что и на остальных страницах. -->
  <div data-site-header></div>

  <!-- Основное содержимое страницы ошибки. -->
  <main class="error-page">

    <!-- Используем существующий контейнер дизайн-системы. -->
    <div class="section-shell error-page__content">

      <!-- Показываем код ошибки крупным техническим элементом. -->
      <p class="error-page__code">404</p>

      <!-- Понятно объясняем посетителю, что произошло. -->
      <h1>Такой страницы<br>не существует.</h1>

      <!-- Даём краткую инструкцию вместо технического сообщения IIS. -->
      <p class="error-page__text">
        Возможно, адрес был изменён или введён неверно.
        Вернитесь на главную страницу БТС.
      </p>

      <!-- Предлагаем очевидный следующий шаг. -->
      <div class="error-page__actions">

        <!-- Используем уже существующий класс основной кнопки сайта. -->
        <a class="primary-button" href="/">
          На главную <span aria-hidden="true">↗</span>
        </a>

      </div>
    </div>
  </main>

  <!-- Подключаем существующую общую архитектуру сайта. -->
  <script src="/assets/site-architecture.js?v=10.8"></script>

  <!-- Подключаем существующий JS, чтобы появилась обычная шапка БТС. -->
  <script src="/assets/main.js?v=10.8"></script>

</body>
</html>
